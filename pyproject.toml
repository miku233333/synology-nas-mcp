[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synology-nas-mcp"
version = "0.1.0"
description = "Self-hosted MCP for Synology NAS files and scoped administration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "mcp==2.2.0",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=6.19,<8",
  "uvicorn>=0.35,<1",
]

[project.scripts]
synology-nas-mcp = "synology_nas_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
